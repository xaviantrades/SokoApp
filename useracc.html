<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Seller Profile | My Shop</title>
        <style>
            :root {
                --primary: #2563eb;
                --secondary: #64748b;
                --bg: #f1f5f9;
                --white: #ffffff;
                --border: #e2e8f0;
                --text: #0f172a;
            }

            body {
              font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial;
        background: #f5f7fa;
        color: #222;
        margin: 0;
        padding: 10px;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
            }

            /* --- Simple Top Nav --- */
            .header {
                display: flex;
                justify-content: space-between;
                
            }

            .header button {
                padding: 10px 18px;
                border: none;
                background: #00a8ff;
                color: white;
                cursor: pointer;
                border-radius: 5px;
                font-weight: bold;
                transition: 0.3s;
            }
            .backbtn{
                text-decoration: none;
                color: black;
            }
            .header button:hover {
                background: #0097e6;
            }
            .backbtn {
                text-decoration: none;
                color: white;
            }

            /* --- Container --- */
            .container {
                max-width: 900px;
                margin: 2rem auto;
                padding: 0 1rem;
            }

            /* --- Profile Header --- */
            .profile-card {
                background: var(--white);
                padding: 2rem;
                border-radius: 12px;
                display: flex;
                align-items: center;
                gap: 1.5rem;
                border: 4px solid var(--border);
                margin-bottom: 2rem;
            }

            .profile-img {
                width: 80px;
                height: 80px;
                background: #dbeafe;
                color: var(--primary);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 2rem;
                font-weight: bold;
            }

            .profile-info h2 {
                margin: 0;
                font-size: 1.2rem;
            }
            .profile-info p {
                color: var(--secondary);
                margin-top: 0.25rem;
            }

            /* --- Order History --- */
            .history-section {
                background: var(--white);
                border-radius: 12px;
                border: 1px solid var(--border);
                overflow: hidden;
            }

            .history-title {
                padding: 1.25rem;
                font-weight: 700;
                border-bottom: 1px solid var(--border);
            }

            .order-item {
                padding: 1.25rem;
                border-bottom: 1px solid var(--border);
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .order-item:last-child {
                border-bottom: none;
            }

            .order-meta {
                display: flex;
                flex-direction: column;
                gap: 0.25rem;
            }
            .order-id {
                font-weight: 600;
                font-size: 0.95rem;
            }
            .order-date {
                font-size: 0.85rem;
                color: var(--secondary);
            }

            .order-price {
                font-weight: 700;
            }

            .badge {
                padding: 0.3rem 0.6rem;
                border-radius: 6px;
                font-size: 0.75rem;
                font-weight: 600;
            }

            .badge-delivered {
                background: #f0fdf4;
                color: #16a34a;
            }
            .badge-shipped {
                background: #eff6ff;
                color: #2563eb;
            }

            @media (max-width: 300px) {
                .stats-row {
                    grid-template-columns: 1fr;
                }
                .profile-card {
                    flex-direction: column;
                    text-align: center;
                }
            }
        </style>
    </head>
    <body>
        <div class="header">
            <div><a href="index.html" class="backbtn" style="color: black; font-weight: 600;">BACK</a></div>
            <div><button onclick="gopage()">sell</button></div>
        </div>

        <div class="container">
            <div class="profile-card">
                <div class="profile-img">JD</div>
                <div class="profile-info">
                    <h1>Jane Doe</h1>
                    <h2>Location: Ishaka</h2>
                    <h2>Contact: 0780611480</h2>
                    <p>Top Rated Seller • Member since 2023</p>
                </div>
            </div>
        </div>

        <div class="history-section">
            <div class="history-title">Order History</div>

            <div class="order-item">
                <div class="order-meta">
                    <span class="order-id">#99201 - Vintage Camera</span>
                    <span class="order-date">Feb 20, 2026</span>
                </div>
                <div style="text-align: right">
                    <div class="order-price">$120.00</div>
                    <span class="badge badge-shipped">Shipped</span>
                </div>
            </div>

            <div class="order-item">
                <div class="order-meta">
                    <span class="order-id">#99185 - Wool Scarf</span>
                    <span class="order-date">Feb 18, 2026</span>
                </div>
                <div style="text-align: right">
                    <div class="order-price">$35.00</div>
                    <span class="badge badge-delivered">Delivered</span>
                </div>
            </div>

            <div class="order-item">
                <div class="order-meta">
                    <span class="order-id">#99172 - Desk Lamp</span>
                    <span class="order-date">Feb 15, 2026</span>
                </div>
                <div style="text-align: right">
                    <div class="order-price">$58.00</div>
                    <span class="badge badge-delivered">Delivered</span>
                </div>
            </div>
        </div>

        <script src="javasoko.js"></script>
    </body>
</html>
